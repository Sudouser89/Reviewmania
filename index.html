<!DOCTYPE html>
<html>
<style type="text/css">
@import url(https://fonts.googleapis.com/css?family=Open+Sans);

body{
  background: #f2f2f2;
  font-family: 'Open Sans', sans-serif;
}

.search {
  width: 100%;
  position: relative;
  display: flex;
}

.searchTerm {
  width: 100%;
  border: 3px solid #00B4CC;
  border-right: none;
  padding: 5px;
  height: 20px;
  border-radius: 5px 0 0 5px;
  outline: none;
  color: #9DBFAF;
}

.searchTerm:focus{
  color: #00B4CC;
}

.searchButton {
  width: 40px;
  height: 36px;
  border: 1px solid #00B4CC;
  background: #00B4CC;
  text-align: center;
  color: #fff;
  border-radius: 0 5px 5px 0;
  cursor: pointer;
  font-size: 20px;
}

/*Resize the wrap to see the search bar change!*/
.wrap{
  width: 30%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
<div class="wrap">
  <img src="makise.gif" style="margin-left : 170px;">
   <h1>What a waste of time........</h1>
   <div class="search">
      <input type="text" class="searchTerm" id="term" placeholder="Search Anime!!">
      <button type="submit" class="searchButton" onclick="myFunction()">
      <span class="material-symbols-outlined">
      search
      </span>
     </button>
   </div>
   <h3>Name Entered:</h3>
   <div id="result"></div>
</div>
</body>


<script>
// Check browser support

function myFunction() {
   if (typeof(Storage) !== "undefined") {
     // Store
     localStorage.search = document.getElementById("term").value;
     // Retrieve
     document.getElementById("result").innerHTML = localStorage.search;
   } else {
     document.getElementById("result").innerHTML = "Sorry, your browser does not support Web Storage...";
   }
}
</script>
</html>
